services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${DB_NAME:-houtaiguanli}
      POSTGRES_USER: ${DB_USER:-uav}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uav}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-uav} -d ${DB_NAME:-houtaiguanli}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Loopback MQTT broker for Lingyun protocol A/C replay. Not a live field broker.
  # api does not depend on this service: local `spring-boot:run` connects to host 127.0.0.1:1883.
  mosquitto:
    profiles: ["qa"]
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: ../server
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-houtaiguanli}
      DB_USER: ${DB_USER:-uav}
      DB_PASSWORD: ${DB_PASSWORD:-uav}
      SPRING_PROFILES_ACTIVE: production
      APP_SOURCE_MODE: live
      APP_DEV_SEED_ENABLED: "false"
      # 空库首次启动时一次性创建唯一超级管理员（首次登录须改密）；库里已有用户时不再创建。
      # 初始密码只写在 deploy/.env（见 .env.example，不提交）或运行环境里；空库未填写时 api 拒绝启动并提示该变量。
      # APP_SUPER_ADMIN_ACCOUNT 每次启动都用于校验唯一超级管理员，创建后不要再改。
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-true}
      APP_SUPER_ADMIN_ACCOUNT: ${APP_SUPER_ADMIN_ACCOUNT:-admin1}
      APP_SUPER_ADMIN_NAME: ${APP_SUPER_ADMIN_NAME:-超级管理员}
      APP_SUPER_ADMIN_PASSWORD: ${APP_SUPER_ADMIN_PASSWORD:-}
      EVIDENCE_DIR: /data/evidence
      MAP_DATA_DIR: /data/map-data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8081}:8080"
    volumes:
      - ../data/evidence:/data/evidence
      - ${MAP_PACKAGE_DATA_DIR:-../../demo-ronghe/map-data}:/data/map-data

  business-web:
    image: nginx:1.27
    volumes:
      - ${BUSINESS_UI_DIST:-../../demo-ronghe/dongying-vue/dist}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MAP_PACKAGE_DATA_DIR:-../../demo-ronghe/map-data}:/map-data:ro
    ports:
      - "5173:80"
    depends_on:
      - api

  admin-web:
    image: nginx:1.27
    volumes:
      - ../ruoyi-ui/dist:/usr/share/nginx/html:ro
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5175:80"
    depends_on:
      - api
      - business-web

volumes:
  pgdata: {}
