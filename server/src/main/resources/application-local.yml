server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    activate:
      on-profile: "local & !prod & !production"
  task:
    scheduling:
      # MQTT 续租、通知轮询与融合处理并行，避免历史回放拖住实时接入。
      pool:
        size: 4
  flyway:
    # 协作者 A 的 V202609050001 编号低于本地库已应用版本；仅本地开发库允许乱序应用，生产配置不放开。
    out-of-order: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/houtaiguanli}
    username: ${DB_USER:uav}
    password: ${DB_PASSWORD:uav}
    hikari:
      # 本地电脑休眠、Docker 重启后主动淘汰失效连接，避免后台线程长时间卡在旧连接上。
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1500000}
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: false

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

app:
  advisory:
    auto-sms:
      # 仅本地演示模拟短信；生产模式无渠道时不会发送或伪造送达。
      enabled: ${APP_ADVISORY_AUTO_SMS_ENABLED:false}
      fresh-seconds: ${APP_ADVISORY_AUTO_SMS_FRESH_SECONDS:120}
      event-seconds: ${APP_ADVISORY_AUTO_SMS_EVENT_SECONDS:300}
      poll-millis: ${APP_ADVISORY_AUTO_SMS_POLL_MILLIS:2000}
    auto-voice:
      # 核实属实并短信送达后观察 3 秒；仍在告警空域才拨打。电话后再观察 10 秒。
      enabled: ${APP_ADVISORY_AUTO_VOICE_ENABLED:false}
      poll-millis: ${APP_ADVISORY_AUTO_VOICE_POLL_MILLIS:2000}
  fusion:
    # 2026-09-29 用户开启自动研判：持续处理接入观测，仍受来源模式校验约束。
    enabled: ${APP_FUSION_ENABLED:true}
    batch-size: 5
    prioritize-fresh-sources: true
  flight-device-check:
    # 用户授权使用独立 MQTT 模拟器演示 mock 计划；真实计划不使用这些模拟设备。
    mqtt-demo-enabled: ${FLIGHT_DEVICE_CHECK_MQTT_DEMO_ENABLED:false}
  source-mode: live
  evidence-dir: ./data/evidence
  map-package:
    # 新后端默认使用自身数据目录；需要对外提供地图时通过 MAP_DATA_DIR 显式指定。
    data-dir: ${MAP_DATA_DIR:./data/map-data}
  handoff:
    channel: ${APP_HANDOFF_CHANNEL:none}
  device:
    mock-adapter:
      enabled: ${APP_DEVICE_MOCK_ADAPTER_ENABLED:false}
  dev-seed:
    enabled: ${APP_DEV_SEED_ENABLED:false}
    password: ${APP_DEV_SEED_PASSWORD:changeme}
  # 空库自举唯一超级管理员（dev-seed 关闭后本地没有种子账号，靠这里建登录账号）。
  # 仅在 app_user 为空时创建；首次登录强制改密。密码满足 6-32 位、含大小写/数字/特殊字符。
  bootstrap-admin:
    enabled: true
    account: admin1
    name: 超级管理员
    password: Admin@2026dev
  flight:
    status-advance:
      enabled: ${APP_FLIGHT_STATUS_ADVANCE_ENABLED:false}
  # 本地告警到处罚按三条预置规则判定。生产默认关闭，不在这里放开。
  automation-rules:
    enabled: false
    fact-max-age-ms: 120000
  # 自动研判有效的新鲜无人机观测；启动不生成演示数据、不回放历史。
  rule-engine:
    enabled: ${APP_RULE_ENGINE_ENABLED:true}
    allow-demo-active: ${APP_RULE_ENGINE_ALLOW_DEMO_ACTIVE:false}
    replay:
      run-on-start: ${APP_RULE_ENGINE_REPLAY_RUN_ON_START:false}
  disposal:
    expiry:
      enabled: true
      poll-millis: 60000
    # 没人打开授权详情时也要结案，否则自动反制的回执会拖过有效期，干扰接不上。
    receipt-sync:
      enabled: true
      interval-millis: 15000
  # 本地演示按业务主流程自动引导光电；生产环境仍使用 application.yml 的安全默认值 false，需显式开启。
  eo-edge:
    # 模拟器默认按 5 秒发送一次光电心跳；本地判活需覆盖一次发送间隔和调度抖动。
    heartbeat-timeout-millis: ${APP_EO_HEARTBEAT_TIMEOUT_MILLIS:15000}
    auto-track-enabled: ${APP_EO_AUTO_TRACK_ENABLED:false}
  network:
    allow-loopback-when-listed: true
