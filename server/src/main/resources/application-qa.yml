# Explicit local test overlay; never load this document in production.
spring:
  config:
    activate:
      on-profile: "local & qa & !production"

app:
  # 流程9的目标均带模拟来源；仅 local,qa 模拟预测窗口扩展到120秒，真实目标仍为10/20/30秒。
  prediction:
    qa-simulated-horizon-seconds: ${APP_PREDICTION_QA_SIMULATED_HORIZON_SECONDS:120}
  # 直接写入气象风险仅供显式隔离测试；设备模拟器提交观测和预报，由平台规则判断风险。
  weather-risk:
    qa:
      enabled: ${APP_WEATHER_RISK_QA_ENABLED:false}
  session:
    # 活跃的本地 QA 模拟器会话在接近到期时自动续期；停止使用后仍按 TTL 过期。
    rolling-enabled: true
  notifications:
    transport: simulator
  # 本地 QA 视频默认开放，可显式关闭；播放仍经平台鉴权代理。
  video:
    qa-enabled: ${APP_VIDEO_QA_ENABLED:true}
    media-api-origin: ${APP_VIDEO_MEDIA_API_ORIGIN:http://127.0.0.1:9997}
    media-hls-origin: ${APP_VIDEO_MEDIA_HLS_ORIGIN:http://127.0.0.1:8888}
    media-username: ${APP_VIDEO_MEDIA_USERNAME:qa-platform}
    media-password: ${APP_VIDEO_MEDIA_PASSWORD:}
    # 未设置上面的读取密码时，读设备模拟器"开启视频推流"自动生成的本机私有凭据文件（只取 read）。
    media-password-file: ${APP_VIDEO_MEDIA_PASSWORD_FILE:${user.home}/.dongying-qa/qa-video-credentials.json}
    media-rtsp-origin: ${APP_VIDEO_MEDIA_RTSP_ORIGIN:rtsp://127.0.0.1:8554}
    # 告警核实属实、反制开始时自动截图并录像（2026-10-19 用户确认）；需要本机装有 ffmpeg。
    auto-capture:
      enabled: ${APP_VIDEO_AUTO_CAPTURE_ENABLED:true}
      ffmpeg-path: ${APP_VIDEO_FFMPEG_PATH:ffmpeg}
      clip-seconds: ${APP_VIDEO_AUTO_CAPTURE_CLIP_SECONDS:30}
  dev-seed:
    enabled: false
  fusion:
    enabled: true
    replay:
      seed-enabled: false
      run-on-start: false
  rule-engine:
    c04:
      enabled: ${APP_RULE_ENGINE_C04_ENABLED:true}
      poll-millis: ${APP_RULE_ENGINE_C04_POLL_MILLIS:60000}
      window-minutes: ${APP_RULE_ENGINE_C04_WINDOW_MINUTES:30}
    enabled: true
    allow-demo-active: true
    replay:
      run-on-start: false
  automation-rules:
    enabled: ${APP_AUTOMATION_RULES_ENABLED:true}
  advisory:
    auto-sms:
      enabled: true
    auto-voice:
      enabled: true
  qa:
    reporting:
      # 用户确认本地验收开放模拟报表；可显式关闭，服务仍拒绝 production/prod 和非 QA 环境。
      enabled: ${APP_QA_REPORTING_ENABLED:true}
    device-setup:
      enabled: true
  handoff:
    channel: simulator
  device:
    mock-adapter:
      enabled: false
  eo-edge:
    auto-track-enabled: ${APP_EO_AUTO_TRACK_ENABLED:true}
    # 验收自动联动仅限模拟通道，真实光电须由正式部署单独授权。
    auto-track-source-modes: replay
  flight:
    status-advance:
      # 计划按自身时段推进，避免模拟输入的执行状态跨日冻结；固定状态夹具可显式关闭。
      enabled: ${APP_FLIGHT_STATUS_ADVANCE_ENABLED:true}
