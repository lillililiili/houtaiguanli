.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;color:#c0d1e9}.field select{height:34px;padding:0 10px;border:1px solid #214b82;border-radius:5px;background:#061735;color:#d9e9ff;outline:none}.filter-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.alarm-table{width:100%;border-collapse:collapse;table-layout:fixed}.alarm-table th{height:39px;text-align:left;padding:0 8px;color:#d9e8fc;font-weight:700;background:#112d5a;border-bottom:1px solid #25518d;white-space:nowrap}.alarm-table td{height:57px;padding:7px 8px;color:#d5e4f8;border-bottom:1px solid #153764;vertical-align:middle;overflow:hidden}.alarm-table tbody tr{cursor:pointer}.alarm-table tbody tr:hover,.alarm-table tbody tr.selected{background:#0e2c5b}.alarm-table tbody tr.selected{box-shadow:inset 3px 0 #2f9cff}.subline{display:block;margin-top:2px;color:#90a8cc;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mono{font-family:Consolas,monospace}.level,.status,.tag{display:inline-flex;align-items:center;justify-content:center;border:1px solid currentColor;border-radius:4px;padding:3px 7px;font-size:12px;line-height:1}.level.low{color:#55a9ff;background:rgba(48,123,221,.12)}.level.medium{color:#ffbe3d;background:rgba(219,153,34,.12)}.level.high{color:#ff4f75;background:rgba(214,48,79,.13)}.status.pending{color:#ffbf42;background:rgba(219,151,26,.14)}.status.confirm{color:#43d59a;background:rgba(30,161,105,.14)}.tag.sim{color:#c18cff;background:rgba(134,84,210,.13);margin-bottom:3px}.pager{height:50px;display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:0 13px;color:#9eb5d3}.pager button{height:29px;border:1px solid #24528c;border-radius:4px;background:#0a234d;padding:0 9px}.pager .current{border-color:#378cff;color:#fff;background:#103a76}.right-col{display:flex;flex-direction:column;gap:10px;min-width:0}.map-panel{height:244px;flex:0 0 244px}.map-stage{position:relative;height:calc(100% - 39px);overflow:hidden;background:#0b3566}.map-stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(25deg,transparent 0 44%,rgba(53,113,193,.27) 44.3% 44.8%,transparent 45%),linear-gradient(160deg,transparent 0 55%,rgba(53,113,193,.26) 55.2% 55.7%,transparent 56%),linear-gradient(90deg,rgba(37,104,181,.22) 1px,transparent 1px),linear-gradient(rgba(37,104,181,.16) 1px,transparent 1px);background-size:100% 100%,100% 100%,46px 34px,46px 34px;opacity:.9}.map-label{position:absolute;color:#a9c3e6;font-size:12px;z-index:1}.map-label.a{left:18%;top:31%}.map-label.b{left:62%;top:26%}.map-label.c{left:42%;top:63%}.map-label.d{right:11%;top:48%}.map-route{position:absolute;left:20%;top:52%;width:58%;height:2px;background:#1bd0ff;box-shadow:0 0 8px rgba(27,208,255,.8);transform:rotate(-8deg);z-index:2}.map-route:before,.map-route:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#1bd0ff;top:-3px}.map-route:before{left:0}.map-route:after{right:0}.map-target{position:absolute;right:18%;top:38%;width:31px;height:31px;border-radius:50%;border:2px solid #ff4c6e;background:rgba(255,55,91,.3);box-shadow:0 0 0 9px rgba(255,55,91,.1),0 0 18px rgba(255,55,91,.75);z-index:2;display:grid;place-items:center;color:#fff}.map-target svg{width:16px;height:16px}.map-zoom{position:absolute;left:11px;top:12px;z-index:3;display:flex;flex-direction:column}.map-zoom button{width:31px;height:31px;border:1px solid #2a6cae;background:#092c5b;color:#deefff}.map-attribution{position:absolute;left:8px;bottom:4px;color:#a5c3e7;font-size:10px;z-index:3}.map-note{position:absolute;right:10px;bottom:5px;color:#c7d9ef;font-size:11px;z-index:3}.detail-panel{min-height:0;flex:1;display:flex;flex-direction:column}.detail-body{padding:0 12px 16px;overflow:auto}.track-card,.video-card{border-bottom:1px solid #183d70;padding:12px 0}.track-head,.video-head{display:flex;justify-content:space-between;align-items e;width:7px;height:7px;border-radius:50%;background:#2ccfa0;left:-5px;top:11px}.log-item span{display:block;color:#8da8c9;margin-top:2px}.toast{position:fixed;right:22px;bottom:22px;z-index:20;padding:10px 14px;border:1px solid #2f75b4;border-radius:6px;background:#0b2857;color:#eef7ff;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.workspace{grid-template-columns:minmax(0,1fr) 390px}.sidebar{width:150px;flex-basis:150px}}@media(max-width:860px){.sidebar{display:none}.workspace{grid-template-columns:1fr}.right-col{min-height:720px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
  <div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const icons={alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4 2.8 20h18.4L12 4Z"/><path d="M12 9v5m0 3h.01"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 12 4.2 4.2L19 6.5"/></svg>',radar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14a8 8 0 0 1 16 0M7 14a5 5 0 0 1 10 0M12 14l4-6"/><circle cx="12" cy="14" r="1.2"/></svg>',map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 6 6-3 4 3 6-3v15l-6 3-4-3-6 3V6Z"/><path d="M10 3v15m4-12v15"/></svg>',refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 20v-5h-5"/></svg>',locate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="6"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/></svg>',back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m14 6-6 6 6 6"/></svg>',full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m18 0v5h-5"/></svg>',dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="13" rx="1.5"/><path d="M8 9h3m-3 3h5m3-3h1m-1 3h1M8 21h8"/></svg>',flight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h18M12 3v18M5 5l14 14M19 5 5 19"/></svg>',legal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 7 3v5c0 4.5-3 7.8-7 10-4-2.2-7-5.5-7-10V6l7-3Z"/><path d="m8.5 11.5 2.3 2.3 4.7-5"/></svg>',folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h7l2 2h9v10H3V6Z"/><path d="M3 10h18"/></svg>'};
    const events=[{id:'告警-0905-004',level:'低',levelClass:'low',target:'目标-0905-101',reason:'无飞行授权',status:'已核实',risk:false,time:'13:35:50'},{id:'告警-0905-003',level:'高',levelClass:'high',target:'目标-0905-101',reason:'闯入限制空域',status:'已核实',risk:true,time:'13:35:50'},{id:'告警-0905-001',level:'高',levelClass:'high',target:'目标-0905-101',reason:'航线偏离',status:'待核实',risk:true,time:'13:35:50'},{id:'告警-0905-005',level:'低',levelClass:'low',target:'—',reason:'超视距',status:'待核实',risk:false,time:'13:35:50'},{id:'告警-0905-002',level:'中',levelClass:'medium',target:'—',reason:'超出计划高度',status:'待核实',risk:true,time:'13:35:50'},{id:'告警-0905-006',level:'高',levelClass:'high',target:'—',reason:'临时管制生效',status:'待核实',risk:true,time:'13:35:50'},{id:'告警-0907-013',level:'高',levelClass:'high',target:'目标-0907-203',reason:'闯入禁飞区',status:'已核实',risk:true,time:'10:00:00'}];
    const state={selectedId:'告警-0905-004',view:location.hash==='#disposal'?'disposal':'alarm',paused:false,notice:null};const app=document.querySelector('#app'),toast=document.querySelector('#toast');const item=()=>events.find(e=>e.id===state.selectedId)||events[0];const ico=n=>icons[n]||icons.alert;
    function topbar(){return `<header class="topbar"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 32 22" fill="none"><path d="M2 5 10 5l6 6 6-6h8l-8 8-6-6-6 6H2l8-8L2 5Z" fill="#27a9f0"/><path d="m11 14 5 5 5-5" stroke="#27a9f0" stroke-width="2"/></svg></span><span>无人机融合感知与低空安全管理平台</span></div><div class="top-actions"><span class="time">${ico('clock')}2026-10-02 13:41:32</span><button class="top-btn">${ico('dashboard')}数据大屏</button><button class="top-btn">${ico('full')}全屏</button><button class="user-btn"><span class="avatar">超</span>超级管理员⌄</button></div></header>`}
    function navItem(icon,label,active=false){return `<div class="nav-item ${active?'active':''}" data-nav="${label}"><span class="nav-ico">${ico(icon)}</span>${label}</div>`}function sidebar(){return `<aside class="sidebar"><div class="nav-group"><div class="nav-title">感知监测</div>${navItem('radar','融合感知')}</div><div class="nav-group"><div class="nav-title">飞行监管</div>${navItem('flight','飞行计划')}${navItem('legal','合法性研判')}${navItem('map','空域管理')}</div><div class="nav-group"><div class="nav-title">事件处置</div>${navItem('alert','告警事件',true)}${navItem('folder','移送与处罚')}</div><div class="nav-group"><div class="nav-title">分析报告</div>${navItem('dashboard','运行统计')}${navItem('folder','证据管理')}</div></aside>`}
    function kpis(){const p=events.filter(e=>e.status==='待核实').length,c=events.filter(e=>e.status==='已核实').length;return `<section class="kpis"><div class="kpi blue"><span class="kpi-icon">${ico('alert')}</span><div><div class="kpi-label">今日告警总数</div><div class="kpi-value">${events.length}</div></div></div><div class="kpi amber"><span class="kpi-icon">${ico('alert')}</span><div><div class="kpi-label">待核实</div><div class="kpi-value">${p}</div></div></div><div class="kpi orange"><span class="kpi-icon">${ico('radar')}</span><div><div class="kpi-label">反制中</div><div class="kpi-value">0</div></div></div><div class="kpi red"><span class="kpi-icon">${ico('radar')}</span><div><div class="kpi-label">干扰中</div><div class="kpi-value">0</div></div></div><div class="kpi cyan"><span class="kpi-icon">${ico('alert')}</span><div><div class="kpi-label">告警已确认</div><div class="kpi-value">${c}</div></div></div><div class="kpi blue"><span class="kpi-icon">${ico('check')}</span><div><div class="kpi-label">误报</div><div class="kpi-value">0</div></div></div></section>`}
    function filters(){return `<div class="filters"><div class="filter-grid"><div class="field"><label>等级</label><select><option>全部</option><option>高</option><option>中</option><option>低</option></select></div><div class="field"><label>类别</label><select><option>全部</option><option>无人机入侵</option><option>超视距</option></select></div><div class="field"><label>状态</label><select><option>全部</option><option>待核实</option><option>已核实</option></select></div><div class="field"><label>区域</label><select><option>全部</option><option>告警演示区域</option></select></div></div><div class="filter-actions"><button class="btn small">${ico('refresh')}刷新</button><button class="btn small">导出 CSV</button></div></div>`}
    function table(){return `<section class="panel left-panel"><div class="panel-head"><div class="panel-title">告警列表</div><span style="color:#91a9cc;font-size:12px">共 ${events.length} 条</span></div>${filters()}<div class="table-wrap"><table class="alarm-table"><thead><tr><th style="width:15%">告警编号 / 时间⌄</th><th style="width:8%">等级</th><th style="width:17%">类别 / 类型</th><th style="width:20%">关联目标 / 区域</th><th style="width:28%">告警内容</th><th style="width:12%">状态</th></tr></thead><tbody>${events.map(e=>`<tr class="${e.id===state.selectedId?'selected':''}" data-select="${e.id}"><td><b class="mono">${e.id}</b><span class="subline">${e.time}</span></td><td><span class="level ${e.levelClass}">${e.level}</span></td><td><span class="tag sim">模拟</span><span class="subline">无人机入侵</span></td><td><span class="mono">${e.target}</span><span class="subline">告警演示区域</span></td><td><span>来源 告警模拟源（模拟）· 发生 2026-10-02</span><span class="subline">${e.reason}</span></td><td><span class="status ${e.status==='已核实'?'confirm':'pending'}">${e.status}</span></td></tr>`).join('')}</tbody></table></div><div class="pager"><span>共 ${events.length} 条</span><button>‹</button><button class="current">1</button><button>›</button><button>10 条/页⌄</button><span>共 1 页</span></div></section>`}
    function mapPanel(){return `<section class="panel map-panel"><div class="panel-head"><div class="panel-title">关联目标定位与轨迹</div><div class="panel-tools"><button class="btn small">无轨迹</button><button class="btn small">${ico('locate')}定位</button></div></div><div class="map-stage"><div class="map-label a">津南区</div><div class="map-label b">滨海新区</div><div class="map-label c">G2516</div><div class="map-label d">告警演示区域</div><div class="map-route"></div><div class="map-target">${ico('alert')}</div><div class="map-zoom"><button>${ico('plus')}</button><button>${ico('minus')}</button></div><div class="map-attribution">© OpenStreetMap contributors · Prot omaps（开发数据）</div><div class="map-note">20 km</div></div></section>`}
    function tracking(){return `<div class="track-card"><div class="track-head"><div><strong>光电追踪</strong><span>&nbsp; 自动追踪未启用</span></div><button class="btn small">刷新</button></div><div class="track-note"><b>当前范围没有可用空闲光电设备</b><span>需要时可由处置人员手动补充追踪</span></div><button class="btn small" style="margin-top:9px">暂停自动追踪</button></div><div class="video-card"><div class="video-head"><strong>实时视频</strong><div class="track-actions"><button class="btn small">刷新</button><button class="btn small">收起视频</button></div></div><div class="video-empty">暂无跟踪画面</div></div>`}
    function eventHero(e){return `<div class="detail-hero"><div class="detail-hero-main"><div class="detail-icon">${ico('alert')}</div><div><div class="detail-kicker">告警事件</div><div class="detail-title">无人机入侵</div><div class="detail-id">${e.id}</div></div></div><div class="detail-tags"><span class="level ${e.levelClass}">${e.level}</span><span class="status ${e.status==='已核实'?'confirm':'pending'}">${e.status}</span></div></div>`}
    function alertDetail(e){const confirmed=e.status==='已核实';return `${tracking()}${eventHero(e)}<div class="info-section"><div class="section-title">告警信息</div><div class="info-grid"><div class="info-item"><small>触发时间</small><span>2026-10-02 13:35:50</span></div><div class="info-item"><small>接收时间</small><span>2026-10-02 13:35:50</span></div><div class="info-item"><small>违规原因</small><span>${e.reason}</span></div><div class="info-item"><small>关联目标</small><span class="mono">${e.target}</span></div><div class="info-item"><small>所在区域</small><span>告警演示区域</span></div><div class="info-item"><small>数据来源</small><span>告警模拟源（模拟）</span></div></div></div><div class="handoff"><div class="handoff-head"><strong>${confirmed?'已由合法性判定页核实':'等待合法性判定页核实'}</strong><span class="status ${confirmed?'confirm':'pending'}">${confirmed?'已核实':'待核实'}</span></div><p class="handoff-note">${confirmed?'关联告警已自动移送处置页面，告警页只读显示核实结果，不再重复点击核实。':'关联告警完成核实后，系统自动移送处置页面。告警页不提供第二次核实入口。'}</p>${confirmed?`<div class="risk-line"><span class="risk-label">当时风险判断</span><strong class="risk-value ${e.risk?'alert':'safe'}">${e.risk?'有风险':'无风险'}</strong></div><button class="btn primary disposal-link" data-enter-disposal>进入处置</button>`:''}</div><div class="progress-box"><div class="progress-head"><strong>处置进度</strong><span>${confirmed?'已自动进入处置':'等待核实'}</span></div><p class="progress-note">${confirmed?'处置页面已生成待办理事项，通知选择在处置页面完成。':'完成合法性判定后自动更新本页状态。'}</p></div>`}
    function disposalDetail(e){return `<div class="disposal-summary"><div class="summary-top"><div><div class="detail-kicker">处置页面 · 合法性判定页已核实</div><div class="detail-title">${e.id}</div><div class="summary-id">${e.target} · ${e.reason} · 2026-10-02 13:35:50</div></div><button class="btn small" data-back>‹ 返回告警</button></div><div class="risk-card ${e.risk?'alert':''}"><h3>当时风险判断</h3><div class="risk-big">${e.risk?'有风险':'无风险'}</div><p>${e.risk?'合法性判定页记录存在明确违规，当前依据有效。':'合法性判定页记录依据充分，暂未发现需要采取处置的现实风险。'}</p><p>依据来源：合法性判定页 · 违规原因：${e.reason}</p></div></div><div class="action-card"><h3>处置操作</h3><div class="action-row"><div><strong>暂不处置</strong><p>结束本次处置办理，继续监测。</p></div><button class="btn danger ${state.paused?'selected':''}" data-pause>${state.paused?'已暂不处置':'暂不处置'}</button></div></div><div class="notify-card"><h3>上级通知 <span style="color:#91a9cc;font-weight:400;font-size:12px">请选择本次是否通知</span></h3><div class="notify-options"><button class="notify-option ${state.notice==='notify'?'active':''}" data-notice="notify"><strong>通知上级</strong><span>提交当前事件处置摘要</span></button><button class="notify-option ${state.notice==='none'?'active':''}" data-notice="none"><strong>无需通知</strong><span>记录本次无需通知的决定和依据</span></button></div></div><div class="log-card"><h3>操作记录</h3><div class="log-item"><b>告警已核实</b><span>合法性判定页 · 系统自动进入处置</span></div>${state.paused?'<div class="log-item"><b>暂不处置</b><span>本次处置结束，继续监测</span></div>':''}${state.notice?`<div class="log-item"><b>${state.notice==='notify'?'通知上级':'无需通知'}</b><span>已记录本次通知选择</span></div>`:''}</div>`}
    function render(){const e=item();app.innerHTML=`${topbar()}<div class="shell">${sidebar()}<main class="content"><div class="breadcrumb"><span>首页</span><span>›</span><span>事件处置</span><span>›</span><strong>${state.view==='disposal'?'处置页面':'告警事件'}</strong></div>${kpis()}<nav class="worktabs"><button class="active">告警与处置</button><button>反制办理</button></nav><div class="workspace">${table()}<div class="right-col">${mapPanel()}<section class="panel detail-panel"><div class="panel-head"><div class="panel-title">${state.view==='disposal'?'处置页面':'告警详情与处置'}</div><span style="color:#91a9cc;font-size:12px">${state.view==='disposal'?'仅在此选择处置与上级通知':'关联告警自动进入处置'}</span></div><div class="detail-body">${state.view==='disposal'?disposalDetail(e):alertDetail(e)}</div></section></div></div></main></div>`;bind()}
    function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),2200)}
    function bind(){document.querySelectorAll('[data-select]').forEach(row=>row.onclick=()=>{state.selectedId=row.dataset.select;state.view='alarm';state.paused=false;state.notice=null;location.hash='#alarm';render()});document.querySelectorAll('[data-enter-disposal]').forEach(btn=>btn.onclick=()=>{state.view='disposal';location.hash='#disposal';render()});document.querySelectorAll('[data-back]').forEach(btn=>btn.onclick=()=>{state.view='alarm';location.hash='#alarm';render()});document.querySelectorAll('[data-pause]').forEach(btn=>btn.onclick=()=>{state.paused=true;show('已记录：暂不处置，继续监测');render()});document.querySelectorAll('[data-notice]').forEach(btn=>btn.onclick=()=>{state.notice=btn.dataset.notice;show(state.notice==='notify'?'已记录：通知上级':'已记录：无需通知');render()});document.querySelectorAll('[data-nav="告警事件"]').forEach(btn=>btn.onclick=()=>{state.view='alarm';location.hash='#alarm';render()})}
    window.onhashchange=()=>{state.view=location.hash==='#disposal'?'disposal':'alarm';render()};render();
  </script>
</body>
</html>
