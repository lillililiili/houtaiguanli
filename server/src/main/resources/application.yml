server:
  port: 8080

spring:
  application:
    name: low-altitude-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/uav}
    username: ${DB_USER:uav}
    password: ${DB_PASSWORD:uav}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/postgresql
    clean-disabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 地图包可明显大于普通证据附件；各业务接口仍在应用层执行自己的更小限制。
      max-file-size: 512MB
      max-request-size: 513MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  source-mode: ${APP_SOURCE_MODE:mock}
  evidence-dir: ${EVIDENCE_DIR:./data/evidence}
  map-package:
    data-dir: ${MAP_DATA_DIR:./data/map-data}
    max-upload-bytes: ${MAP_MAX_UPLOAD_BYTES:536870912}
    max-expanded-bytes: ${MAP_MAX_EXPANDED_BYTES:2147483648}
    max-files: ${MAP_MAX_FILES:10000}
    # 当前业务库数据所属城市；启用其它城市时，前台地图叠加层自动清空但数据库记录不删除。
    business-city-code: ${APP_BUSINESS_CITY_CODE:370500}
  login:
    fail-limit: ${LOGIN_FAIL_LIMIT:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:30}
  session:
    ttl-hours: ${SESSION_TTL_HOURS:8}
  # 交接投递渠道：none=未接通（生产缺省，交接停在待投递）；mock=模拟上级接口（立即送达并回执）；接真实上级接口后新增实现并在此切换。
  handoff:
    channel: ${APP_HANDOFF_CHANNEL:none}
  dev-seed:
    enabled: ${APP_DEV_SEED_ENABLED:false}
    password: ${APP_DEV_SEED_PASSWORD:}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    account: ${APP_SUPER_ADMIN_ACCOUNT:}
    name: ${APP_SUPER_ADMIN_NAME:超级管理员}
    password: ${APP_SUPER_ADMIN_PASSWORD:}
  super-admin:
    account: ${APP_SUPER_ADMIN_ACCOUNT:admin1}
  super-admin-recovery:
    enabled: ${APP_SUPER_ADMIN_RECOVERY_ENABLED:false}
    password: ${APP_SUPER_ADMIN_RECOVERY_PASSWORD:}
  live-device:
    enabled: ${APP_LIVE_DEVICE_ENABLED:true}
    instance-id: ${APP_INSTANCE_ID:}
    lease-seconds: ${APP_LIVE_DEVICE_LEASE_SECONDS:30}
  mqtt:
    enabled: ${APP_MQTT_ENABLED:true}
    reconcile-millis: ${APP_MQTT_RECONCILE_MILLIS:1000}
  eo-edge:
    heartbeat-timeout-millis: ${APP_EO_HEARTBEAT_TIMEOUT_MILLIS:3000}
    poll-millis: ${APP_EO_POLL_MILLIS:1000}
    command-timeout-millis: ${APP_EO_COMMAND_TIMEOUT_MILLIS:10000}
    auto-track-enabled: ${APP_EO_AUTO_TRACK_ENABLED:false}
    auto-track-batch: ${APP_EO_AUTO_TRACK_BATCH:20}
  lingyun-control:
    command-timeout-millis: ${APP_LINGYUN_CONTROL_TIMEOUT_MILLIS:10000}
  countermeasure-4ch:
    command-timeout-millis: ${APP_COUNTERMEASURE_4CH_TIMEOUT_MILLIS:10000}
    sim-port: ${APP_COUNTERMEASURE_4CH_SIM_PORT:10006}
  network:
    allow-loopback-when-listed: ${APP_NETWORK_ALLOW_LOOPBACK_WHEN_LISTED:false}
  # 阶段 7 规则引擎：默认关闭调度；DEMO 参数版本默认不允许激活（只能做影子验证）。
  flight:
    # 飞行计划执行状态按计划时段推进（待执行 → 执行中 → 已完成）；默认关闭，本地演示打开。见需求确认表增补四 F10。
    status-advance:
      enabled: ${APP_FLIGHT_STATUS_ADVANCE_ENABLED:false}
      poll-millis: ${APP_FLIGHT_STATUS_ADVANCE_POLL_MILLIS:60000}
  rule-engine:
    # C04 空间安全风险定时评估：默认关闭，只在 PostGIS 部署上按需打开（H2 会记 UNAVAILABLE）。
    c04:
      enabled: false
      poll-millis: 60000
      # 调度回看窗口（分钟）；这是调度参数，不是规则阈值——规则阈值一律在 rule_param 里。
      window-minutes: 30
    enabled: ${APP_RULE_ENGINE_ENABLED:false}
    poll-millis: ${APP_RULE_ENGINE_POLL_MILLIS:5000}
    batch-size: ${APP_RULE_ENGINE_BATCH_SIZE:50}
    lease-seconds: ${APP_RULE_ENGINE_LEASE_SECONDS:30}
    instance-id: ${APP_INSTANCE_ID:}
    allow-demo-active: ${APP_RULE_ENGINE_ALLOW_DEMO_ACTIVE:false}
    replay:
      run-on-start: ${APP_RULE_ENGINE_REPLAY_RUN_ON_START:false}
  # 阶段 8 融合引擎：默认关闭摄取调度；实测雷达提升与回放自启动默认关闭。
  fusion:
    enabled: ${APP_FUSION_ENABLED:false}
    poll-millis: ${APP_FUSION_POLL_MILLIS:500}
    batch-size: ${APP_FUSION_BATCH_SIZE:50}
    lease-millis: ${APP_FUSION_LEASE_MILLIS:30000}
    max-attempts: ${APP_FUSION_MAX_ATTEMPTS:5}
    live-promotion:
      enabled: ${APP_FUSION_LIVE_PROMOTION_ENABLED:false}
    replay:
      run-on-start: ${APP_FUSION_REPLAY_RUN_ON_START:false}
