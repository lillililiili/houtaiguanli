server:
  port: ${SERVER_PORT:8081}

spring:
  task:
    scheduling:
      # MQTT 续租、通知轮询与融合处理并行，避免历史回放拖住实时接入。
      pool:
        size: 4
  flyway:
    # 协作者 A 的 V202609050001 编号低于本地库已应用版本；仅本地开发库允许乱序应用，生产配置不放开。
    out-of-order: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/houtaiguanli}
    username: ${DB_USER:uav}
    password: ${DB_PASSWORD:uav}
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: false

app:
  advisory:
    auto-sms:
      # 仅本地演示模拟短信；生产模式无渠道时不会发送或伪造送达。
      enabled: ${APP_ADVISORY_AUTO_SMS_ENABLED:true}
      fresh-seconds: ${APP_ADVISORY_AUTO_SMS_FRESH_SECONDS:120}
      event-seconds: ${APP_ADVISORY_AUTO_SMS_EVENT_SECONDS:300}
      poll-millis: ${APP_ADVISORY_AUTO_SMS_POLL_MILLIS:10000}
  fusion:
    # 本机 MQTT 回放必须消费融合 inbox，持续生成近期目标；仍可显式关闭。
    enabled: ${APP_FUSION_ENABLED:true}
    batch-size: 5
    prioritize-fresh-sources: true
  flight-device-check:
    # 用户授权使用独立 MQTT 模拟器演示 mock 计划；真实计划不使用这些模拟设备。
    mqtt-demo-enabled: ${FLIGHT_DEVICE_CHECK_MQTT_DEMO_ENABLED:true}
  source-mode: live
  evidence-dir: ./data/evidence
  map-package:
    # 新后端默认使用自身数据目录；需要对外提供地图时通过 MAP_DATA_DIR 显式指定。
    data-dir: ${MAP_DATA_DIR:./data/map-data}
  handoff:
    channel: ${APP_HANDOFF_CHANNEL:mock}
  device:
    mock-adapter:
      enabled: ${APP_DEVICE_MOCK_ADAPTER_ENABLED:true}
  dev-seed:
    enabled: ${APP_DEV_SEED_ENABLED:true}
    password: ${APP_DEV_SEED_PASSWORD:changeme}
  flight:
    status-advance:
      enabled: ${APP_FLIGHT_STATUS_ADVANCE_ENABLED:true}
  # 本地演示与验收同参：引擎开着、允许激活 DEMO 规则集、启动时回放阶段七与演示体量场景，合法性研判页才有记录可看。
  rule-engine:
    enabled: ${APP_RULE_ENGINE_ENABLED:true}
    allow-demo-active: ${APP_RULE_ENGINE_ALLOW_DEMO_ACTIVE:true}
    replay:
      run-on-start: ${APP_RULE_ENGINE_REPLAY_RUN_ON_START:true}
  disposal:
    expiry:
      enabled: true
      poll-millis: 60000
  # 本地演示按业务主流程自动引导光电；生产环境仍使用 application.yml 的安全默认值 false，需显式开启。
  eo-edge:
    auto-track-enabled: ${APP_EO_AUTO_TRACK_ENABLED:true}
  network:
    allow-loopback-when-listed: true
