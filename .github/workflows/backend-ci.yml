name: Backend CI

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: uav
          POSTGRES_PASSWORD: uav
          POSTGRES_DB: ci_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uav -d ci_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/stage456_verify_ci
      POSTGRES_TEST_USER: uav
      POSTGRES_TEST_PASSWORD: uav
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: server/pom.xml
      - run: chmod +x mvnw
      - name: Create isolation databases for the PostgreSQL suites
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d ci_verify -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d ci_verify -c "CREATE DATABASE stage456_verify_ci;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d stage456_verify_ci -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d ci_verify -c "CREATE DATABASE stage2_target_verify_ci;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d stage2_target_verify_ci -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d ci_verify -c "CREATE DATABASE advisory_verify_ci;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d advisory_verify_ci -c "CREATE EXTENSION IF NOT EXISTS postgis;"
      - name: Full test suite (H2 + PostgreSQL suites on stage456_verify_ci)
        run: ./mvnw -B test -Dtest='!TargetReadPostgresApiTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: TargetRead PostgreSQL suite (needs its own stage2_target_verify_* database)
        run: ./mvnw -B -Dtest=TargetReadPostgresApiTest -Dsurefire.failIfNoSpecifiedTests=false test
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/stage2_target_verify_ci
      - name: Advisory PostgreSQL suite (needs its own advisory_verify_* database)
        run: ./mvnw -B -Dtest=UavAdvisoryPostgresTest,AutoSmsPostgresTest,AutoVoicePostgresTest,EvidencePreviewPostgresTest,FusionInboxFreshSourceTest,MergedEvaluationAlarmTest -Dsurefire.failIfNoSpecifiedTests=false test
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/advisory_verify_ci
      - name: Package (tests already ran above)
        run: ./mvnw -B -DskipTests package
      - name: Test summary (run / failures / errors / skipped)
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          failed=[]
          for p in glob.glob('target/surefire-reports/TEST-*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
              if int(r.get('failures',0)) or int(r.get('errors',0)):
                  failed.append((r.get('name'),r.get('failures'),r.get('errors')))
          print(f"## Backend tests\n\n| run | failures | errors | skipped |\n| --- | --- | --- | --- |\n| {t} | {f} | {e} | {s} |\n")
          if failed:
              print("### Failed suites\n\n| suite | failures | errors |\n| --- | --- | --- |")
              for name, failures, errors in sorted(failed):
                  print(f"| {name} | {failures} | {errors} |")
              print()
          print("跳过项包含专用数据库、浏览器验收和显式开关门禁；请核对对应测试的 skipped 原因，不能将跳过记为通过，也不能仅按跳过数量判断数据库是否连接。")
          EOF
