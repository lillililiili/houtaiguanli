# Explicit local test overlay; never load this document in production.
spring:
  config:
    activate:
      on-profile: "local & qa & !production"

app:
  session:
    # 活跃的本地 QA 模拟器会话在接近到期时自动续期；停止使用后仍按 TTL 过期。
    rolling-enabled: true
  notifications:
    transport: simulator
  dev-seed:
    enabled: false
  fusion:
    enabled: true
    replay:
      seed-enabled: false
      run-on-start: false
  rule-engine:
    enabled: true
    allow-demo-active: true
    replay:
      run-on-start: false
  automation-rules:
    enabled: ${APP_AUTOMATION_RULES_ENABLED:true}
  advisory:
    auto-sms:
      enabled: true
    auto-voice:
      enabled: true
  qa:
    device-setup:
      enabled: true
  handoff:
    channel: simulator
  device:
    mock-adapter:
      enabled: false
  eo-edge:
    auto-track-enabled: false
  flight:
    status-advance:
      # 计划按自身时段推进，避免模拟输入的执行状态跨日冻结；固定状态夹具可显式关闭。
      enabled: ${APP_FLIGHT_STATUS_ADVANCE_ENABLED:true}
