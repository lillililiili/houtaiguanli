spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations:
      - classpath:db/migration

app:
  source-mode: mock
  fusion:
    enabled: false
  rule-engine:
    enabled: false
    # C04 定时评估在 application.yml 里默认打开；测试里由用例显式调用，不让后台每分钟插运行记录。
    c04:
      enabled: false
  # 自动规则执行引擎 2026-10-03 起产品默认打开。用例里它每 2 秒在后台开事务轮询，
  # 撞上用例收尾删 schema 会互相等锁、整轮测试挂死（CI 上卡满 6 小时被取消）。
  # 用例默认关掉；要测它的用例自己显式打开或 SpyBean 掉开关。
  automation-rules:
    enabled: false
  evidence-dir: ./target/evidence-test
  map-package:
    data-dir: ./target/map-data-test
  login:
    fail-limit: 5
    lock-minutes: 30
  session:
    ttl-hours: 8
  dev-seed:
    enabled: true
    password: changeme
  live-device:
    enabled: false
  mqtt:
    enabled: false
